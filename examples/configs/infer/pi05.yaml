schema_version: 1
task: infer

exp:
  name: pi05_infer
  output_dir: runs
  seed: 42

model:
  name: pi05
  target: dobot_nexus.models.pi05.modeling_pi05:Pi05Model
  # The artifact restores weights, training data mapping, normalization, and tokenizer.
  artifact: ${env:PI05_ARTIFACT,runs/pi05_bc/checkpoints/latest.txt}
  checkpoint: null
  precision: bf16
  # null restores the trained public dimensions; explicit values must match.
  state_dim: null
  action_dim: null
  action_horizon: null
  inference_backend: torch

runtime:
  device: auto
  autocast: auto  # "off" disables outer AMP; model-owned dtype casts remain active.
  # Legacy baseline on CUDA: native numerical boundaries, compiled action
  # expert, cached timestep modulations and whole-sampler Graph replay.
  # For CPU inference set compile=false and cuda_graph=false.
  compile: true
  compile_mode: legacy
  compile_preserve_precision: true
  cuda_graph: true
  cuda_graph_max_entries: 2

inference:
  num_steps: 10
  execute_steps: 8
  seed: 42
  warmup: true

server:
  host: 127.0.0.1
  port: 12021
