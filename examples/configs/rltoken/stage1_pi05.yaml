extends: ../train/pi05.yaml

exp:
  name: pi05_rltoken_stage1
model:
  target: dobot_nexus.models.pi05.rltoken.modeling_stage1:Pi05RLTokenModel
  inference_parameter_precision: fp32
  rltoken:
    initialization: bc
    alpha_vla: 1.0
    token:
      input_dim: 2048
      width: 256
      heads: 8
      layers: 2
      max_tokens: 2048
      dropout: 0.0
      seed: 42
    # Set these from the controller contract before constructing a model.
    control_dt: 0.05
    action_codec:
      name: absolute_affine_v1
      low: null
      high: null
      units: controller_command
