extends: dobot_td3.yaml
exp:
  name: rltoken_offline_actor_bc
algorithm:
  target: dobot_nexus.algorithms.rltoken.pretraining:RLTokenPretrainTrainer
  initialize_from: null
  pretrain:
    phase: actor_bc
    task_identity: sparse_terminal_success_v1
    # Task-specific initialization gate; tune on the held-out episodes.
    max_validation_loss: 0.01
    initialize: {}
data:
  cache_path: ${env:RLT_CACHE,/path/to/cache}
runtime:
  launcher: local
  device: cpu
train:
  max_steps: 1000
  save_every: 100
