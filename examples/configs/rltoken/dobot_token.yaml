extends: stage1_pi05.yaml
exp:
  name: pi05_rltoken_bottleneck
algorithm:
  target: dobot_nexus.algorithms.rltoken.token_pretraining:TokenPretrainTrainer
  token:
    # Whole episode IDs in the same dataset. Replace with the task's split.
    train_episodes: [0, 1, 2, 3]
    validation_episodes: [4, 5]
    min_zero_ratio: 1.2
    min_shuffle_ratio: 1.2
model:
  rltoken:
    training_mode: token_only
    alpha_vla: 0.0
    token:
      input_dim: 2048
      width: 2048
      heads: 8
      encoder_layers: 2
      decoder_layers: 2
      max_tokens: 2048
      dropout: 0.1
      mode: bottleneck
      selection: image_only
runtime:
  launcher: local
  device: cpu
optim:
  lr: 0.0001
  weight_decay: 0.0
train:
  max_steps: 10000
  save_every: 1000
