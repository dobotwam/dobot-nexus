schema_version: 1
task: infer
exp:
  name: pi05_memory_infer
  output_dir: runs
  seed: 42
model:
  name: pi05
  target: dobot_nexus.models.pi05.memory.modeling_memory:Pi05MemoryModel
  artifact: ${env:MEMORY_ARTIFACT,runs/pi05_memory/checkpoints/latest.txt}
  checkpoint: null
  precision: bf16
  # Public dimensions are restored from the Artifact.
  state_dim: null
  action_dim: null
  action_horizon: null
  inference_backend: torch
  # Memory configuration and frozen vision.npz are restored from the Artifact.
  # No OpenPI checkout or JAX runtime is used by this backend.
runtime:
  device: auto
  # OpenPI numerical boundaries with a compiled action expert, cached history
  # K/V and timestep modulations. Frozen history vision also uses Graph replay.
  # For CPU inference set compile=false and cuda_graph=false.
  compile: true
  compile_mode: openpi
  compile_preserve_precision: true
  cuda_graph: true
  cuda_graph_max_entries: 2
inference:
  num_steps: 10
  execute_steps: 8
  seed: 42
  warmup: true
