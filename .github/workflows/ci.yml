name: CPU contracts and wheel
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install -c requirements-ci.txt torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-ci.txt -e '.[accelerate,serve,websocket,tensorboard]' pandas pyarrow Pillow imageio opencv-python-headless safetensors tqdm sentencepiece einops httpx setuptools wheel
          python -m pip check
      - name: Compile and test contracts
        run: |
          python -m compileall -q src tests scripts examples/real_robot
          python -m unittest discover -s tests -v
      - name: Build and install wheel outside checkout
        run: python scripts/check_wheel.py
  model-extra-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pi0.5 and serving extras
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[pi05,serve,websocket]" 'setuptools>=77' wheel
          python -m pip check
      - name: Check model environment, wheel targets and a synthetic LeRobot v2.1 sample
        run: |
          python scripts/env/check_model_env.py --model pi05 --extra serve --extra websocket
          python scripts/check_wheel.py
          python -m unittest tests.test_inline_source.InlineSourceTest.test_metadata_order_does_not_cross_episodes_or_decode_future_images
